<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Trees</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M6 12c6 0 5 6 12 6' fill='none' stroke='%23b8a68a' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M6 12c6 0 5-6 12-6' fill='none' stroke='%23d97757' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='5' cy='12' r='3' fill='%236b8f9c'/%3E%3Ccircle cx='19' cy='18' r='2.5' fill='%23b8a68a'/%3E%3Ccircle cx='19' cy='6' r='3' fill='%23d97757'/%3E%3C/svg%3E" />
  </head>
  <body>
    <aside id="sidebar">
      <div id="brand" class="brand">Claude Trees</div>
      <input id="filter" type="search" placeholder="Filter…" autocomplete="off" />
      <div id="list" class="list"></div>
    </aside>

    <main>
      <header>
        <div id="title" class="title">Pick a session</div>
        <div id="stats" class="stats"></div>
        <div class="spacer"></div>
        <button id="questions" class="tool">Questions</button>
        <button id="compare" class="tool">Compare branches</button>
        <button id="fit" class="tool">Fit</button>
      </header>
      <div id="canvas" class="canvas">
        <div id="empty" class="empty-state">
          <div id="empty-text">Pick a project, then a session, to see its tree.</div>
        </div>
        <div id="tip" class="tip"></div>
      </div>
      <footer>
        <div class="legend">
          <span><i class="swatch" style="background:var(--human)"></i>you</span>
          <span><i class="swatch" style="background:var(--assistant)"></i>Claude</span>
          <span><i class="swatch fork"></i>fork</span>
          <span><i class="swatch" style="background:var(--accent)"></i>current path</span>
          <span><i class="swatch bar"></i>wrote files / ran commands</span>
        </div>
        <div id="status" class="status"></div>
      </footer>
    </main>

    <section id="panel" class="panel" hidden></section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
